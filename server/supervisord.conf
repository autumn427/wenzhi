[unix_http_server]
file=/dev/shm/wenzhi-backend-30120/supervisor.sock
chmod=0700
[supervisord]
logfile=/tos-mlp-zgci/wenzhi-backend/.runtime/logs/supervisord.log
logfile_maxbytes=1MB
logfile_backups=2
pidfile=/dev/shm/wenzhi-backend-30120/supervisord.pid
childlogdir=/tos-mlp-zgci/wenzhi-backend/.runtime/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///dev/shm/wenzhi-backend-30120/supervisor.sock
[program:wenzhi-backend]
directory=/tos-mlp-zgci/wenzhi-backend/releases/node-d1-20260914
command=/usr/bin/node --env-file=/tos-mlp-zgci/wenzhi-backend/.runtime/server.env /tos-mlp-zgci/wenzhi-backend/releases/node-d1-20260914/server-build/server.mjs
environment=TMPDIR="/dev/shm/wenzhi-backend-30120",NODE_ENV="production"
autostart=true
autorestart=unexpected
startsecs=10
startretries=2
stopasgroup=true
killasgroup=true
stdout_logfile=/tos-mlp-zgci/wenzhi-backend/.runtime/logs/backend.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true

[program:wenzhi-tunnel]
command=/usr/local/bin/cloudflared tunnel --config /tos-mlp-zgci/wenzhi-backend/releases/node-d1-20260914/server/tunnel.yml --no-autoupdate run
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/tos-mlp-zgci/wenzhi-backend/.runtime/logs/tunnel.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
